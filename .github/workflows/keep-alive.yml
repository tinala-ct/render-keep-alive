name: Keep Render Alive (08:00 - 22:00 TH)

on:
  schedule:
    # รันทุก 14 นาที ระหว่างเวลา 08:00 - 22:00 น. เวลาไทย (UTC 01:00 - 15:00 น.)
    - cron: '*/14 1-15 * * *'
  workflow_dispatch: # เปิดปุ่มสำหรับกดทดสอบเอง

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Website
        run: |
          curl -s -I "https://record-renthouse.onrender.com/" > /dev/null
